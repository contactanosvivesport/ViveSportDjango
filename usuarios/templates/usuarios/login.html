{% load static %}

<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Iniciar sesión - ViveSport</title>

    <link
        rel="stylesheet"
        href="{% static 'usuarios/css/auth.css' %}"
    >

</head>

<body>

    <main class="auth-page">

        <section class="auth-card">

            <!-- MARCA -->

            <div class="brand">

                <img
                    src="{% static 'usuarios/img/logo.png' %}"
                    alt="Logo ViveSport"
                    class="brand-logo"
                >

                <h1>VIVESPORT</h1>

                <span>
                    TORNEOS DEPORTIVOS | SENA
                </span>

            </div>


            <!-- ENCABEZADO -->

            <div class="auth-title">

                <h2>Iniciar sesión</h2>

                <p>
                    Accede a tu cuenta de ViveSport
                </p>

            </div>


            <!-- ERROR -->

            {% if error %}

                <div class="alert-error">
                    {{ error }}
                </div>

            {% endif %}


            <!-- FORMULARIO -->

            <form method="POST">

                {% csrf_token %}


                <!-- CORREO -->

                <div class="input-group">

                    <label for="correo">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        value="{{ correo|default:'' }}"
                        placeholder="correo@ejemplo.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- CONTRASEÑA -->

                <div class="input-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <div class="password-container">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Ingresa tu contraseña"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            onclick="togglePassword()"
                        >
                            Mostrar
                        </button>

                    </div>

<div style="text-align: right; margin: 0 0 18px;">
    <a
        href="{% url 'solicitar_recuperacion' %}"
        style="color: #006b53; text-decoration: none; font-size: 14px;"
    >
        ¿Olvidaste tu contraseña?
    </a>
</div>


                </div>


                <!-- BOTÓN -->

                <button
                    type="submit"
                    class="btn-login"
                >
                    INGRESAR
                </button>

            </form>


            <!-- REGISTRO -->

            <div class="auth-register">

                <span>
                    ¿No tienes una cuenta?
                </span>

                <a href="{% url 'registro' %}">
                    Registrarse
                </a>

            </div>

        </section>

    </main>


    <script>

        function togglePassword() {

            const password =
                document.getElementById("password");

            const button =
                document.querySelector(".toggle-password");


            if (password.type === "password") {

                password.type = "text";

                button.textContent = "Ocultar";

            } else {

                password.type = "password";

                button.textContent = "Mostrar";

            }

        }

    </script>

</body>

</html>
