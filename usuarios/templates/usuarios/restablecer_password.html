
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva contraseña | ViveSport</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #f4f6f8;
            font-family: Arial, sans-serif;
        }

        .panel {
            width: 100%;
            max-width: 440px;
            padding: 36px;
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, .09);
        }

        .marca {
            margin-bottom: 24px;
            text-align: center;
            color: #004f3f;
            font-size: 27px;
            font-weight: 800;
        }

        h1 {
            color: #18332d;
            text-align: center;
            font-size: 23px;
        }

        p {
            color: #64716d;
            font-size: 14px;
            line-height: 1.6;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            font-weight: 600;
            color: #263b35;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccd5d1;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            border: 0;
            border-radius: 8px;
            background: #006b53;
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: #004f3f;
        }

        .mensajes {
            margin: 16px 0;
            padding: 12px;
            border-radius: 8px;
            background: #fff1f0;
            color: #8b2420;
        }
    </style>
</head>
<body>
    <main class="panel">
        <div class="marca">VIVESPORT</div>

        <h1>Crear nueva contraseña</h1>

        <p>
            Elige una contraseña segura y confírmala para
            actualizar el acceso a tu cuenta.
        </p>

        {% if messages %}
            <div class="mensajes" role="alert">
                {% for message in messages %}
                    <p>{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <label for="password">Nueva contraseña</label>
            <input
                type="password"
                id="password"
                name="password"
                autocomplete="new-password"
                required
            >

            <label for="confirmar_password">
                Confirmar nueva contraseña
            </label>
            <input
                type="password"
                id="confirmar_password"
                name="confirmar_password"
                autocomplete="new-password"
                required
            >

            <button type="submit">
                Guardar nueva contraseña
            </button>
        </form>
    </main>
</body>
</html>
